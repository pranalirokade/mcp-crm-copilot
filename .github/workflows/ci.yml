name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install pytest
      - run: pytest -q
      - run: PYTHONPATH=src COPILOT_DB=/tmp/ci.db python -m copilot.cli seed && PYTHONPATH=src COPILOT_DB=/tmp/ci.db python -m copilot.cli triage
